name: Publish to pub.dev

# Pushing a vX.Y.Z tag publishes that version through pub.dev's automated
# publishing (GitHub OIDC; no secrets). The tag must match `version:` in
# pubspec.yaml, and a version that is already on pub.dev is skipped instead of
# failing, so re-pushing or back-filling a tag is harmless.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  check:
    name: Compare the tag with pubspec.yaml and pub.dev
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec.yaml version $version" >&2
            exit 1
          fi
          if curl -fsS "https://pub.dev/api/packages/libtailscale/versions/$version" > /dev/null; then
            echo "libtailscale $version is already on pub.dev; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Inlined rather than dart-lang/setup-dart's reusable publish workflow: that
  # one checks out without submodules, and pub then reports the
  # third_party/libtailscale gitlink as a checked-in ignored file and fails.
  publish:
    name: Publish to pub.dev
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # setup-dart exchanges it for a pub.dev token
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
