name: node_console
description: >-
  Flutter example for package:libtailscale: a headless Tailscale / Headscale
  node with a connect form, node details, peers, chat over the tailnet and
  HTTP fetch. Runs on macOS, iOS, Android and Linux.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  libtailscale:
    path: ../../
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# How the application obtains libtailscale.{dylib,so}. No native release is
# published yet, so build it from the pinned upstream sources with the Go
# toolchain (Go >= 1.25.5; Xcode for iOS, the NDK for Android). See the
# package README, "Build configuration", for prebuilt_dir and the download path.
hooks:
  user_defines:
    libtailscale:
      build_from_source: true
